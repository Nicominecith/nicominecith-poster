[build]
  base = "/"
  command = "npm i -g bun && bun install --ignore-scripts && bun run build"
  publish = "dist/site"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/film/*"
  to = "/film/index.html"
  status = 200

[[redirects]]
  from = "/buch/*"
  to = "/buch/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
